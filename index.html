<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Stacking Chairs 🪑</title>
<style>
:root {
  --bg: #0d0618;
  --surface: #1a0d2e;
  --panel: #221040;
  --border: #4a1d96;
  --accent: #7c3aed;
  --accent2: #a855f7;
  --gold: #fbbf24;
  --red: #ef4444;
  --text: #e9d5ff;
  --muted: #7c5ea0;
  --cell-size: 52px;
  --gap: 3px;
}

* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%; height:100%;
  overflow:hidden;
  font-family:'Segoe UI',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  user-select:none;
  -webkit-user-select:none;
}

/* ─── Canvas background ─── */
#bg-canvas {
  position:fixed; inset:0;
  pointer-events:none;
  z-index:0;
}

/* ─── Screens ─── */
.screen {
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  z-index:10;
  transition:opacity .35s, transform .35s;
}
.screen.hidden {
  opacity:0; pointer-events:none; transform:scale(.96);
}

/* ─── Start screen ─── */
#screen-start {
  gap:28px;
  background:radial-gradient(ellipse at 50% 40%, #2d1060 0%, #0d0618 70%);
}

.game-logo {
  text-align:center;
}
.game-logo .emoji {
  font-size:5rem;
  display:block;
  animation: floatChair 3s ease-in-out infinite;
  filter: drop-shadow(0 0 24px #a855f7);
}
@keyframes floatChair {
  0%,100% { transform:translateY(0) rotate(-3deg); }
  50%      { transform:translateY(-14px) rotate(3deg); }
}
.game-logo h1 {
  font-size:3.2rem;
  font-weight:900;
  letter-spacing:3px;
  background:linear-gradient(135deg,#c084fc,#818cf8,#38bdf8);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  text-shadow:none;
  margin-top:8px;
}
.game-logo .tagline {
  color:var(--muted);
  font-size:.95rem;
  margin-top:4px;
  letter-spacing:1px;
}

.best-display {
  display:flex; align-items:center; gap:8px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:50px;
  padding:8px 24px;
  font-size:.85rem;
  color:var(--muted);
}
.best-display .val {
  color:var(--gold);
  font-weight:700;
  font-size:1rem;
}

.how-to {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px 28px;
  max-width:360px;
  text-align:center;
  line-height:1.7;
  font-size:.88rem;
  color:var(--muted);
}
.how-to strong { color:var(--text); }

.btn-start {
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:#fff;
  border:none;
  padding:16px 56px;
  font-size:1.25rem;
  font-weight:700;
  border-radius:50px;
  cursor:pointer;
  letter-spacing:1px;
  box-shadow:0 0 40px #7c3aed88;
  transition:transform .15s, box-shadow .15s;
}
.btn-start:hover {
  transform:scale(1.06);
  box-shadow:0 0 60px #a855f7aa;
}
.btn-start:active { transform:scale(.97); }

/* ─── Game screen ─── */
#screen-game {
  flex-direction:column;
  gap:12px;
  justify-content:center;
  padding:12px;
}

.hud {
  display:flex;
  gap:12px;
  align-items:center;
  width:100%;
  max-width:476px;
}

.score-card {
  flex:1;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:8px 12px;
  text-align:center;
}
.score-card .lbl {
  font-size:.6rem;
  text-transform:uppercase;
  letter-spacing:1.5px;
  color:var(--muted);
}
.score-card .val {
  font-size:1.4rem;
  font-weight:800;
  color:var(--accent2);
  line-height:1.1;
  transition:transform .15s;
}
.score-card .val.bump {
  animation:scoreBump .25s ease;
}
@keyframes scoreBump {
  0%   { transform:scale(1); }
  50%  { transform:scale(1.35); color:#fbbf24; }
  100% { transform:scale(1); }
}

#grid-wrap {
  position:relative;
}

#grid {
  display:grid;
  grid-template-columns:repeat(8, var(--cell-size));
  grid-template-rows:   repeat(8, var(--cell-size));
  gap:var(--gap);
  background:var(--panel);
  border:2px solid var(--border);
  border-radius:14px;
  padding:7px;
  box-shadow:0 0 40px #4a1d9644, inset 0 0 20px #0005;
}

.cell {
  width:var(--cell-size);
  height:var(--cell-size);
  background:#12082a;
  border-radius:7px;
  border:1px solid #2e1650;
  display:flex; align-items:center; justify-content:center;
  position:relative;
  transition:background .08s, border-color .08s;
  overflow:hidden;
}
.cell.occupied { border-color:transparent; }
.cell.hi  { background:#3b2070; border-color:var(--accent2); }
.cell.bad { background:#3b0f0f; border-color:var(--red); }
.cell.clear-anim {
  animation:cellClear .45s cubic-bezier(.36,0,.66,-.56) forwards;
}
@keyframes cellClear {
  0%   { transform:scale(1); opacity:1; }
  40%  { transform:scale(1.25) rotate(12deg); opacity:.8; }
  100% { transform:scale(0) rotate(30deg); opacity:0; }
}

/* Chair drawn in CSS */
.chair {
  display:flex; flex-direction:column; align-items:center;
  width:38px; height:38px; justify-content:center; gap:1px;
}
.c-back {
  width:26px; height:10px;
  border-radius:4px 4px 1px 1px;
  border-bottom:2px solid rgba(0,0,0,.25);
}
.c-seat {
  width:30px; height:13px;
  border-radius:3px;
  border-top:2px solid rgba(255,255,255,.15);
  border-bottom:2px solid rgba(0,0,0,.25);
}
.c-legs {
  display:flex; gap:12px;
}
.c-leg {
  width:5px; height:7px;
  border-radius:0 0 3px 3px;
}

/* Piece tray */
#tray {
  display:flex; gap:8px;
  background:var(--panel);
  border:2px solid var(--border);
  border-radius:14px;
  padding:12px 16px;
  width:100%; max-width:476px;
  justify-content:space-around;
  align-items:center;
  min-height:110px;
}

.pw {
  display:flex; align-items:center; justify-content:center;
  min-width:130px; min-height:86px;
  cursor:grab;
  border-radius:10px;
  transition:transform .2s, background .2s;
  padding:6px;
}
.pw:hover { transform:scale(1.1); background:#2d1a50; }
.pw.dragging { opacity:.25; cursor:grabbing; }
.pw.used { opacity:.1; pointer-events:none; }

.pgrid { display:grid; gap:2px; }
.pcell {
  width:26px; height:26px;
  border-radius:5px;
  border:1px solid rgba(0,0,0,.2);
  display:flex; align-items:center; justify-content:center;
}

/* UFO */
.cell.ufo-blocked {
  box-shadow:0 0 16px #22d3eeaa, inset 0 0 10px #22d3ee33 !important;
  border-color:#22d3ee !important;
}
.ufo-overlay {
  position:absolute;
  top:-12px; left:50%;
  transform:translateX(-50%);
  font-size:26px;
  z-index:20;
  pointer-events:none;
  animation:ufoFloat 1.8s ease-in-out infinite;
  filter:drop-shadow(0 0 10px #22d3ee);
}
.ufo-timer {
  position:absolute;
  bottom:2px; right:4px;
  font-size:10px; font-weight:900;
  color:#22d3ee;
  z-index:21;
  pointer-events:none;
  text-shadow:0 0 6px #22d3ee;
}
@keyframes ufoFloat {
  0%,100% { transform:translateX(-50%) translateY(0) rotate(-4deg); }
  50%      { transform:translateX(-50%) translateY(-7px) rotate(4deg); }
}
@keyframes ufoLand {
  0%   { transform:translateX(-50%) translateY(-60px) scale(.5); opacity:0; }
  60%  { transform:translateX(-50%) translateY(4px) scale(1.1); opacity:1; }
  100% { transform:translateX(-50%) translateY(0) scale(1); opacity:1; }
}
.ufo-overlay.landing { animation:ufoLand .6s cubic-bezier(.22,1,.36,1) forwards; }

/* Drag ghost */
#ghost {
  position:fixed; pointer-events:none;
  z-index:1000; display:none;
  gap:var(--gap);
}

/* Floating score popup */
.score-pop {
  position:absolute;
  font-size:1.1rem;
  font-weight:800;
  color:var(--gold);
  pointer-events:none;
  z-index:50;
  text-shadow:0 0 12px #f59e0b;
  animation:popUp .8s ease-out forwards;
}
@keyframes popUp {
  0%   { opacity:1; transform:translateY(0) scale(.8); }
  60%  { opacity:1; transform:translateY(-40px) scale(1.1); }
  100% { opacity:0; transform:translateY(-70px) scale(1); }
}

/* Combo banner */
#combo-banner {
  position:fixed; top:50%; left:50%;
  transform:translate(-50%,-50%);
  font-size:2.6rem; font-weight:900;
  pointer-events:none; opacity:0; z-index:200;
  text-align:center;
  filter:drop-shadow(0 0 20px #fbbf24);
}
#combo-banner.pop {
  animation:comboPop .9s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes comboPop {
  0%   { opacity:1; transform:translate(-50%,-50%) scale(.4); }
  40%  { opacity:1; transform:translate(-50%,-60%) scale(1.15); }
  100% { opacity:0; transform:translate(-50%,-80%) scale(.9); }
}

/* Particle canvas */
#fx-canvas {
  position:fixed; inset:0;
  pointer-events:none; z-index:30;
}

/* ─── Game Over screen ─── */
#screen-over {
  background:rgba(5,2,14,.92);
  gap:24px;
  backdrop-filter:blur(6px);
  z-index:100;
}
#screen-over h2 {
  font-size:3rem; font-weight:900;
  background:linear-gradient(135deg,#ef4444,#f97316);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
}
.over-stats {
  display:flex; gap:16px;
}
.over-stat {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 28px;
  text-align:center;
}
.over-stat .lbl { font-size:.65rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); }
.over-stat .val { font-size:2rem; font-weight:800; color:var(--accent2); }
.over-stat .val.gold { color:var(--gold); }
.new-best {
  color:var(--gold);
  font-size:.9rem;
  font-weight:700;
  letter-spacing:1px;
  animation:pulse 1s ease infinite;
}
@keyframes pulse {
  0%,100% { opacity:1; } 50% { opacity:.5; }
}
.over-btns { display:flex; gap:12px; }
.btn-action {
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:#fff; border:none;
  padding:14px 36px;
  font-size:1.05rem; font-weight:700;
  border-radius:50px; cursor:pointer;
  letter-spacing:.5px;
  box-shadow:0 0 30px #7c3aed66;
  transition:transform .15s, box-shadow .15s;
}
.btn-action:hover { transform:scale(1.05); box-shadow:0 0 50px #a855f7aa; }
.btn-action:active { transform:scale(.97); }
.btn-ghost {
  background:transparent;
  border:2px solid var(--border);
  color:var(--muted);
  padding:14px 36px;
  font-size:1.05rem; font-weight:700;
  border-radius:50px; cursor:pointer;
  transition:border-color .2s, color .2s;
}
.btn-ghost:hover { border-color:var(--accent2); color:var(--text); }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<canvas id="fx-canvas"></canvas>
<div id="combo-banner"></div>

<!-- ══ START SCREEN ══ -->
<div class="screen" id="screen-start">
  <div class="game-logo">
    <span class="emoji">🪑</span>
    <h1>STACKING CHAIRS</h1>
    <p class="tagline">Stapel Stühle — räume Reihen!</p>
  </div>
  <div class="best-display">🏆 Bester Score: <span class="val" id="start-best">0</span></div>
  <div class="how-to">
    <strong>So geht's:</strong><br>
    Ziehe Stuhlgruppen auf das Raster.<br>
    Wenn eine Reihe oder Spalte<br>
    <strong>komplett voll</strong> ist, verschwindet sie. 🪑
  </div>
  <button class="btn-start" id="btn-start">Spiel starten</button>
</div>

<!-- ══ GAME SCREEN ══ -->
<div class="screen hidden" id="screen-game">
  <div class="hud">
    <div class="score-card">
      <div class="lbl">Punkte</div>
      <div class="val" id="hud-score">0</div>
    </div>
    <div class="score-card">
      <div class="lbl">Rekord</div>
      <div class="val" id="hud-best">0</div>
    </div>
    <div class="score-card">
      <div class="lbl">Reihen</div>
      <div class="val" id="hud-lines">0</div>
    </div>
  </div>
  <div id="grid-wrap">
    <div id="grid"></div>
  </div>
  <div id="tray"></div>
</div>

<!-- ══ GAME OVER SCREEN ══ -->
<div class="screen hidden" id="screen-over">
  <h2>Game Over 🪑</h2>
  <div class="over-stats">
    <div class="over-stat">
      <div class="lbl">Punkte</div>
      <div class="val" id="over-score">0</div>
    </div>
    <div class="over-stat">
      <div class="lbl">Rekord</div>
      <div class="val gold" id="over-best">0</div>
    </div>
    <div class="over-stat">
      <div class="lbl">Reihen</div>
      <div class="val" id="over-lines">0</div>
    </div>
  </div>
  <div class="new-best hidden" id="new-best-msg">🏆 Neuer Rekord!</div>
  <div class="over-btns">
    <button class="btn-action" id="btn-restart">Nochmal</button>
    <button class="btn-ghost"  id="btn-menu">Menü</button>
  </div>
</div>

<!-- Drag ghost -->
<div id="ghost"></div>

<script>
/* ═══════════════════════════════════════════
   CONSTANTS & DATA
═══════════════════════════════════════════ */
const GS = 8;
const CELL = 52, GAP = 3, PAD = 7;
const STEP = CELL + GAP;

const COLORS = [
  { bg:'#6d28d9', lt:'#a78bfa', name:'lila' },
  { bg:'#1d4ed8', lt:'#60a5fa', name:'blau' },
  { bg:'#065f46', lt:'#34d399', name:'grün' },
  { bg:'#b45309', lt:'#fbbf24', name:'gelb' },
  { bg:'#9f1239', lt:'#fb7185', name:'rot'  },
  { bg:'#0e7490', lt:'#22d3ee', name:'cyan' },
  { bg:'#7c2d12', lt:'#fb923c', name:'orange'},
  { bg:'#4a1d96', lt:'#c084fc', name:'violett'},
];

const SHAPES = [
  { id:'1x1',    cells:[[0,0]] },
  { id:'1x2',    cells:[[0,0],[0,1]] },
  { id:'2x1',    cells:[[0,0],[1,0]] },
  { id:'1x3',    cells:[[0,0],[0,1],[0,2]] },
  { id:'3x1',    cells:[[0,0],[1,0],[2,0]] },
  { id:'2x2',    cells:[[0,0],[0,1],[1,0],[1,1]] },
  { id:'L',      cells:[[0,0],[1,0],[2,0],[2,1]] },
  { id:'J',      cells:[[0,1],[1,1],[2,0],[2,1]] },
  { id:'T',      cells:[[0,0],[0,1],[0,2],[1,1]] },
  { id:'S',      cells:[[0,1],[0,2],[1,0],[1,1]] },
  { id:'Z',      cells:[[0,0],[0,1],[1,1],[1,2]] },
  { id:'line4',  cells:[[0,0],[0,1],[0,2],[0,3]] },
  { id:'line4v', cells:[[0,0],[1,0],[2,0],[3,0]] },
  { id:'corner', cells:[[0,0],[1,0],[1,1]] },
  { id:'U',      cells:[[0,0],[0,2],[1,0],[1,1],[1,2]] },
  { id:'2x3',    cells:[[0,0],[0,1],[1,0],[1,1],[2,0],[2,1]] },
];

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let grid, score, bestScore, linesCleared, pieces, batchColor;
let placementCount=0, ufoCell=null; // ufoCell: {r,c,remaining}
let dragIdx=null, dragOff=[0,0], ghostInfo=null;

/* ═══════════════════════════════════════════
   AUDIO  (Web Audio API — no files needed)
═══════════════════════════════════════════ */
let audio;
function initAudio() {
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
}
function playTone(freq, dur, type='sine', vol=.18) {
  if (!audio) return;
  const o = audio.createOscillator();
  const g = audio.createGain();
  o.connect(g); g.connect(audio.destination);
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + dur);
  o.start(); o.stop(audio.currentTime + dur);
}
function soundPlace()  { playTone(300,.08,'square',.12); setTimeout(()=>playTone(420,.07,'square',.08),60); }
function soundClear()  { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,.15,'sine',.14),i*70)); }
function soundCombo()  { [659,784,1047,1319].forEach((f,i)=>setTimeout(()=>playTone(f,.18,'sine',.16),i*60)); }
function soundOver()   { [400,330,262].forEach((f,i)=>setTimeout(()=>playTone(f,.3,'sawtooth',.1),i*180)); }

/* ═══════════════════════════════════════════
   BACKGROUND ANIMATION
═══════════════════════════════════════════ */
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
const fxCanvas = document.getElementById('fx-canvas');
const fxCtx = fxCanvas.getContext('2d');

let bgChairs = [];
function initBg() {
  bgCanvas.width = fxCanvas.width = innerWidth;
  bgCanvas.height = fxCanvas.height = innerHeight;
  bgChairs = Array.from({length:18},()=>({
    x: Math.random()*innerWidth,
    y: Math.random()*innerHeight,
    vy: .2 + Math.random()*.5,
    vx: (Math.random()-.5)*.3,
    rot: Math.random()*Math.PI*2,
    vr: (Math.random()-.5)*.01,
    size: 14+Math.random()*20,
    alpha: .04+Math.random()*.06,
    color: COLORS[Math.floor(Math.random()*COLORS.length)].lt,
  }));
}
function drawBg(ts) {
  bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
  bgChairs.forEach(c=>{
    c.x+=c.vx; c.y+=c.vy; c.rot+=c.vr;
    if(c.y>innerHeight+40) { c.y=-40; c.x=Math.random()*innerWidth; }
    bgCtx.save();
    bgCtx.globalAlpha=c.alpha;
    bgCtx.translate(c.x,c.y);
    bgCtx.rotate(c.rot);
    bgCtx.font=`${c.size}px serif`;
    bgCtx.textAlign='center';
    bgCtx.textBaseline='middle';
    bgCtx.fillText('🪑',0,0);
    bgCtx.restore();
  });
  requestAnimationFrame(drawBg);
}

/* ═══════════════════════════════════════════
   CONFETTI CANNON
═══════════════════════════════════════════ */
const CONFETTI_COLORS = [
  '#f87171','#fb923c','#fbbf24','#34d399',
  '#60a5fa','#a78bfa','#f472b6','#fff',
  '#38bdf8','#4ade80','#facc15','#e879f9',
];
let confetti=[];

function fireConfettiCannon(x, y, dirX) {
  /* dirX: -1 = shoots left-to-right, +1 = right-to-left */
  for(let i=0;i<55;i++) {
    const spread = (Math.random()-.5) * 1.8;   // vertical spread
    const power  = 6 + Math.random() * 10;
    confetti.push({
      x, y,
      vx: dirX * power * (.6 + Math.random()*.4),
      vy: -power * (.2 + Math.random()*.6) + spread * 2,
      w:  5 + Math.random()*7,
      h:  3 + Math.random()*5,
      rot: Math.random()*Math.PI*2,
      vr: (Math.random()-.5)*.35,
      color: CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)],
      life: 1,
      decay: .008 + Math.random()*.006,
    });
  }
}

function shootConfettiAtGrid() {
  const rect = gridEl.getBoundingClientRect();
  const midY = rect.top + rect.height * .35;
  fireConfettiCannon(rect.left  + 10, midY, +1);  // left cannon → right
  fireConfettiCannon(rect.right - 10, midY, -1);  // right cannon → left
}

function tickParticles() {
  fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height);
  confetti = confetti.filter(p=>p.life>0);
  confetti.forEach(p=>{
    p.x  += p.vx;
    p.y  += p.vy;
    p.vy += .28;          // gravity
    p.vx *= .98;          // air resistance
    p.rot+= p.vr;
    p.life -= p.decay;
    fxCtx.save();
    fxCtx.globalAlpha = Math.max(0, p.life);
    fxCtx.fillStyle   = p.color;
    fxCtx.translate(p.x, p.y);
    fxCtx.rotate(p.rot);
    fxCtx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    fxCtx.restore();
  });
  requestAnimationFrame(tickParticles);
}

/* ═══════════════════════════════════════════
   SCREENS
═══════════════════════════════════════════ */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

/* ═══════════════════════════════════════════
   GRID DOM
═══════════════════════════════════════════ */
const gridEl = document.getElementById('grid');

function buildGrid() {
  gridEl.innerHTML='';
  for(let r=0;r<GS;r++) for(let c=0;c<GS;c++) {
    const d=document.createElement('div');
    d.className='cell'; d.dataset.r=r; d.dataset.c=c;
    gridEl.appendChild(d);
  }
}

function cell(r,c) { return gridEl.querySelector(`[data-r="${r}"][data-c="${c}"]`); }

function chairHTML(col, small=false) {
  const w=small?'width:16px;height:16px':'width:38px;height:38px';
  const bw=small?10:26, bh=small?4:10;
  const sw=small?12:30, sh=small?5:13;
  const gp=small?5:12, lw=small?3:5, lh=small?3:7;
  return `<div class="chair" style="${w};gap:1px">
    <div class="c-back" style="width:${bw}px;height:${bh}px;background:${col.lt}"></div>
    <div class="c-seat" style="width:${sw}px;height:${sh}px;background:${col.bg}"></div>
    <div class="c-legs" style="gap:${gp}px">
      <div class="c-leg" style="width:${lw}px;height:${lh}px;background:${col.lt}"></div>
      <div class="c-leg" style="width:${lw}px;height:${lh}px;background:${col.lt}"></div>
    </div>
  </div>`;
}

function renderGrid() {
  for(let r=0;r<GS;r++) for(let c=0;c<GS;c++) {
    const el=cell(r,c), e=grid[r][c];
    const isUFO=ufoCell && ufoCell.r===r && ufoCell.c===c;
    if(e) {
      el.className='cell occupied'+(isUFO?' ufo-blocked':'');
      el.style.background=e.color.bg;
      el.style.borderColor=isUFO?'#22d3ee':e.color.lt;
      el.innerHTML=chairHTML(e.color)
        +(isUFO?`<div class="ufo-overlay">🛸</div><div class="ufo-timer">${ufoCell.remaining}</div>`:'');
    } else {
      el.className='cell';
      el.style.background=''; el.style.borderColor=''; el.innerHTML='';
    }
  }
}

function spawnUFO() {
  const candidates=[];
  for(let r=0;r<GS;r++) for(let c=0;c<GS;c++){
    if(grid[r][c] && !(ufoCell&&ufoCell.r===r&&ufoCell.c===c))
      candidates.push({r,c});
  }
  if(!candidates.length) return;
  const pick=candidates[Math.floor(Math.random()*candidates.length)];
  ufoCell={r:pick.r, c:pick.c, remaining:3};
  renderGrid();
  // play a little landing animation
  const el=cell(pick.r,pick.c).querySelector('.ufo-overlay');
  if(el){ el.classList.remove('landing'); void el.offsetWidth; el.classList.add('landing'); }
}

/* ═══════════════════════════════════════════
   PIECES
═══════════════════════════════════════════ */
function pickNewBatchColor() {
  let c;
  do { c = COLORS[Math.floor(Math.random()*COLORS.length)]; } while(c === batchColor);
  batchColor = c;
}

function boardIsEmpty() {
  return grid.every(row=>row.every(v=>!v));
}

// Returns rows/cols sorted by how full they are (most filled first)
function getTargets() {
  const t=[];
  for(let r=0;r<GS;r++){
    const filled=grid[r].filter(v=>v).length;
    if(filled<GS) t.push({type:'row',idx:r,filled});
  }
  for(let c=0;c<GS;c++){
    const filled=grid.filter(row=>row[c]).length;
    if(filled<GS) t.push({type:'col',idx:c,filled});
  }
  return t.sort((a,b)=>b.filled-a.filled);
}

// Check if placing this shape anywhere would complete a specific row or col
function shapeCompletesTarget(shape, target) {
  for(let ar=0;ar<GS;ar++) for(let ac=0;ac<GS;ac++){
    if(!canPlace(shape,ar,ac)) continue;
    const sim=grid.map(row=>[...row]);
    shape.cells.forEach(([dr,dc])=>{sim[ar+dr][ac+dc]=1;});
    if(target.type==='row' && sim[target.idx].every(v=>v)) return true;
    if(target.type==='col' && sim.every(row=>row[target.idx])) return true;
  }
  return false;
}

function newPieces() {
  const usedShapes=new Set();
  const targets=getTargets();
  // shuffle shapes so we don't always pick the same ones
  const shuffled=[...SHAPES].sort(()=>Math.random()-.5);

  pieces=[0,1,2].map(()=>{
    // Find any unused shape that completes one of the targets (most-full first)
    for(const shape of shuffled){
      if(usedShapes.has(shape.id)) continue;
      for(const target of targets){
        if(shapeCompletesTarget(shape,target)){
          usedShapes.add(shape.id);
          return {shape,color:batchColor};
        }
      }
    }
    // Fallback: any unused shape
    for(const shape of shuffled){
      if(!usedShapes.has(shape.id)){usedShapes.add(shape.id);return{shape,color:batchColor};}
    }
    return {shape:shuffled[0],color:batchColor};
  });

  buildTray();
}
  const tray=document.getElementById('tray');
  tray.innerHTML='';
  pieces.forEach((p,i)=>{
    const w=document.createElement('div');
    w.className='pw'+(p?'':' used');
    w.dataset.idx=i;
    if(p) {
      const rows=Math.max(...p.shape.cells.map(c=>c[0]))+1;
      const cols=Math.max(...p.shape.cells.map(c=>c[1]))+1;
      const pg=document.createElement('div');
      pg.className='pgrid';
      pg.style.gridTemplateColumns=`repeat(${cols},26px)`;
      pg.style.gridTemplateRows=`repeat(${rows},26px)`;
      const set=new Set(p.shape.cells.map(([r,c])=>`${r},${c}`));
      for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) {
        const pc=document.createElement('div');
        if(set.has(`${r},${c}`)) {
          pc.className='pcell';
          pc.style.background=p.color.bg;
          pc.style.borderColor=p.color.lt;
          pc.innerHTML=chairHTML(p.color,true);
        } else {
          pc.style.width='26px'; pc.style.height='26px';
        }
        pg.appendChild(pc);
      }
      w.appendChild(pg);
      w.addEventListener('mousedown',e=>startDrag(e,i));
      w.addEventListener('touchstart',e=>startDrag(e,i),{passive:false});
    }
    tray.appendChild(w);
  });
}

/* ═══════════════════════════════════════════
   DRAG & DROP
═══════════════════════════════════════════ */
const ghostEl=document.getElementById('ghost');
let dragging=false;

function startDrag(e,idx) {
  if(!pieces[idx]) return;
  initAudio();
  e.preventDefault();
  dragIdx=idx; dragging=true;
  const p=pieces[idx];
  const rows=Math.max(...p.shape.cells.map(c=>c[0]))+1;
  const cols=Math.max(...p.shape.cells.map(c=>c[1]))+1;
  dragOff=[Math.floor(rows/2), Math.floor(cols/2)];

  // Build ghost
  ghostEl.style.display='grid';
  ghostEl.style.gridTemplateColumns=`repeat(${cols},${CELL}px)`;
  ghostEl.style.gridTemplateRows=`repeat(${rows},${CELL}px)`;
  ghostEl.style.gap=GAP+'px';
  ghostEl.innerHTML='';
  const set=new Set(p.shape.cells.map(([r,c])=>`${r},${c}`));
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) {
    const gc=document.createElement('div');
    gc.style.width=CELL+'px'; gc.style.height=CELL+'px';
    gc.style.borderRadius='7px';
    if(set.has(`${r},${c}`)) {
      gc.style.background=p.color.bg;
      gc.style.border=`2px solid ${p.color.lt}`;
      gc.style.display='flex'; gc.style.alignItems='center'; gc.style.justifyContent='center';
      gc.innerHTML=chairHTML(p.color);
      gc.style.opacity='.85';
    }
    ghostEl.appendChild(gc);
  }

  trayPW(idx).classList.add('dragging');
  moveGhost(e);
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onEnd);
  document.addEventListener('touchmove',onMove,{passive:false});
  document.addEventListener('touchend',onEnd);
}

function trayPW(i){ return document.getElementById('tray').querySelectorAll('.pw')[i]; }

function clientXY(e){ return e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY}; }

function moveGhost(e) {
  const {x,y}=clientXY(e);
  ghostEl.style.left=(x - dragOff[1]*STEP - CELL/2)+'px';
  ghostEl.style.top =(y - dragOff[0]*STEP - CELL/2)+'px';
  clearHi();
  const t=cellAt(x,y);
  if(t) {
    const ar=t[0]-dragOff[0], ac=t[1]-dragOff[1];
    const ok=canPlace(pieces[dragIdx].shape,ar,ac);
    pieces[dragIdx].shape.cells.forEach(([dr,dc])=>{
      const el=cell(ar+dr,ac+dc);
      if(el) el.classList.add(ok?'hi':'bad');
    });
    ghostInfo={ar,ac,ok};
  } else { ghostInfo=null; }
}

function cellAt(x,y) {
  const rect=gridEl.getBoundingClientRect();
  const rx=x-rect.left-PAD, ry=y-rect.top-PAD;
  const c=Math.floor(rx/STEP), r=Math.floor(ry/STEP);
  return (r>=0&&r<GS&&c>=0&&c<GS)?[r,c]:null;
}

function clearHi(){ gridEl.querySelectorAll('.hi,.bad').forEach(el=>el.classList.remove('hi','bad')); }

function onMove(e){ e.preventDefault(); moveGhost(e); }

function onEnd(e) {
  document.removeEventListener('mousemove',onMove);
  document.removeEventListener('mouseup',onEnd);
  document.removeEventListener('touchmove',onMove);
  document.removeEventListener('touchend',onEnd);
  ghostEl.style.display='none';
  clearHi();
  trayPW(dragIdx).classList.remove('dragging');
  if(ghostInfo?.ok) placePiece(dragIdx,ghostInfo.ar,ghostInfo.ac);
  dragging=false; dragIdx=null; ghostInfo=null;
}

/* ═══════════════════════════════════════════
   GAME LOGIC
═══════════════════════════════════════════ */
function canPlace(shape,ar,ac) {
  return shape.cells.every(([dr,dc])=>{
    const r=ar+dr,c=ac+dc;
    return r>=0&&r<GS&&c>=0&&c<GS&&!grid[r][c];
  });
}

function placePiece(idx,ar,ac) {
  const p=pieces[idx];
  p.shape.cells.forEach(([dr,dc])=>{
    grid[ar+dr][ac+dc]={color:p.color, shapeId:p.shape.id};
  });
  pieces[idx]=null;

  // Tick UFO countdown
  if(ufoCell){
    ufoCell.remaining--;
    if(ufoCell.remaining<=0) ufoCell=null;
  }

  // Every 9 placements a UFO lands
  placementCount++;
  if(placementCount%9===0) setTimeout(spawnUFO, 350);

  soundPlace();
  renderGrid();
  buildTray();
  setTimeout(checkClears,100);
}

function rowClears(r) {
  if(!grid[r].every(v=>v!==null)) return false;
  if(ufoCell && ufoCell.r===r) return false; // UFO blocks the row
  return true;
}
function colClears(c) {
  if(!grid.every(row=>row[c]!==null)) return false;
  if(ufoCell && ufoCell.c===c) return false; // UFO blocks the column
  return true;
}

function checkClears() {
  const rows=[], cols=[];
  for(let r=0;r<GS;r++) if(rowClears(r)) rows.push(r);
  for(let c=0;c<GS;c++) if(colClears(c)) cols.push(c);
  if(!rows.length&&!cols.length){ checkContinue(); return; }

  const toKill=new Set();
  rows.forEach(r=>{ for(let c=0;c<GS;c++) toKill.add(`${r},${c}`); });
  cols.forEach(c=>{ for(let r=0;r<GS;r++) toKill.add(`${r},${c}`); });

  const cellEls=[];
  toKill.forEach(k=>{
    const [r,c]=k.split(',').map(Number);
    const el=cell(r,c);
    if(el){ el.classList.add('clear-anim'); cellEls.push(el); }
  });
  shootConfettiAtGrid();

  const n=rows.length+cols.length;
  if(n>1) { soundCombo(); showCombo(n); }
  else soundClear();

  setTimeout(()=>{
    toKill.forEach(k=>{ const [r,c]=k.split(',').map(Number); grid[r][c]=null; });
    linesCleared+=n;
    const pts=n*GS*10 + (n>1?n*60:0);
    score+=pts;
    if(score>bestScore){ bestScore=score; localStorage.setItem('cb_best',bestScore); }
    updateHUD();
    showScorePop(pts, cellEls[0]);
    renderGrid();
    // if board just became empty, switch to a new batch color
    if(boardIsEmpty()) pickNewBatchColor();
    checkContinue();
  },450);
}

function showCombo(n) {
  const b=document.getElementById('combo-banner');
  b.textContent = n>=4?'🏆 MEGA KOMBO!':n>=3?'🪑🪑🪑 DREIFACH!':'🪑🪑 DOPPELT!';
  b.className=''; void b.offsetWidth; b.className='pop';
}

function showScorePop(pts, anchorEl) {
  if(!anchorEl) return;
  const r=anchorEl.getBoundingClientRect();
  const pop=document.createElement('div');
  pop.className='score-pop';
  pop.textContent='+'+pts;
  pop.style.left=r.left+'px'; pop.style.top=r.top+'px';
  document.body.appendChild(pop);
  pop.addEventListener('animationend',()=>pop.remove());
}

function updateHUD() {
  const sv=document.getElementById('hud-score');
  sv.textContent=score;
  sv.classList.remove('bump'); void sv.offsetWidth; sv.classList.add('bump');
  document.getElementById('hud-best').textContent=bestScore;
  document.getElementById('hud-lines').textContent=linesCleared;
}

function checkContinue() {
  // All 3 placed → generate new batch
  if(pieces.every(p=>!p)) newPieces();

  const ok=pieces.some(p=>{
    if(!p) return false;
    for(let r=0;r<GS;r++) for(let c=0;c<GS;c++) if(canPlace(p.shape,r,c)) return true;
    return false;
  });
  if(!ok) setTimeout(gameOver,400);
}

function gameOver() {
  soundOver();
  document.getElementById('over-score').textContent=score;
  document.getElementById('over-best').textContent=bestScore;
  document.getElementById('over-lines').textContent=linesCleared;
  const nb=document.getElementById('new-best-msg');
  nb.classList.toggle('hidden', score<bestScore || score===0);
  showScreen('screen-over');
}

/* ═══════════════════════════════════════════
   START / RESTART
═══════════════════════════════════════════ */
function startGame() {
  grid=Array.from({length:GS},()=>Array(GS).fill(null));
  score=0; linesCleared=0; placementCount=0; ufoCell=null;
  batchColor = COLORS[Math.floor(Math.random()*COLORS.length)];
  buildGrid();
  updateHUD();
  renderGrid();
  newPieces();
  showScreen('screen-game');
}

function loadBest() {
  bestScore=parseInt(localStorage.getItem('cb_best')||'0');
  document.getElementById('start-best').textContent=bestScore;
  document.getElementById('hud-best').textContent=bestScore;
}

/* ═══════════════════════════════════════════
   WIRING
═══════════════════════════════════════════ */
document.getElementById('btn-start').addEventListener('click',()=>{ initAudio(); startGame(); });
document.getElementById('btn-restart').addEventListener('click',()=>{ initAudio(); startGame(); });
document.getElementById('btn-menu').addEventListener('click',()=>{ loadBest(); showScreen('screen-start'); });
window.addEventListener('resize',()=>{
  bgCanvas.width=fxCanvas.width=innerWidth;
  bgCanvas.height=fxCanvas.height=innerHeight;
});

/* ═══════════════════════════════════════════
   BOOT
═══════════════════════════════════════════ */
loadBest();
initBg();
requestAnimationFrame(drawBg);
tickParticles();
</script>
</body>
